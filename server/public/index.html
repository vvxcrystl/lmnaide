<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>lmnaide</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/share.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <!-- Mirrors the Cloud sync card in the Android app's settings. -->
    <!-- Both screens start hidden; app.js shows one once it knows whether you're signed in. -->
    <section id="auth" class="auth" hidden>
      <div class="auth-card">
        <div class="wordmark">
          <svg class="lemon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M2,12a10,10 0 1 0 20,0a10,10 0 1 0 -20,0zM3.1,12a8.9,8.9 0 1 0 17.8,0a8.9,8.9 0 1 0 -17.8,0z"
            />
            <path
              d="M12.78,11.22L15.55,4.94A7.9,7.9 0 0 1 19.06,8.45ZM13.1,12L19.5,9.52A7.9,7.9 0 0 1 19.5,14.48ZM12.78,12.78L19.06,15.55A7.9,7.9 0 0 1 15.55,19.06ZM12,13.1L14.48,19.5A7.9,7.9 0 0 1 9.52,19.5ZM11.22,12.78L8.45,19.06A7.9,7.9 0 0 1 4.94,15.55ZM10.9,12L4.5,14.48A7.9,7.9 0 0 1 4.5,9.52ZM11.22,11.22L4.94,8.45A7.9,7.9 0 0 1 8.45,4.94ZM12,10.9L9.52,4.5A7.9,7.9 0 0 1 14.48,4.5Z"
            /></svg
          ><span>lmnaide</span>
        </div>
        <h1>Your days, on every device</h1>
        <p>
          Sign in with the same account you use for Cloud sync in the Android
          app. Events, tasks and calendars sync; device contacts and appearance
          stay local.
        </p>
        <form id="login">
          <label class="field"
            ><span>Email</span
            ><input id="email" type="email" autocomplete="username" required
          /></label>
          <label class="field"
            ><span>Password · at least 10 characters</span
            ><input
              id="password"
              type="password"
              autocomplete="current-password"
              minlength="10"
              required
          /></label>
          <div class="actions">
            <button class="filled">Sign in</button
            ><button type="button" id="register" class="text">
              Create account
            </button>
          </div>
        </form>
      </div>
    </section>

    <section id="calendar" class="shell" hidden>
      <header class="topbar">
        <button
          type="button"
          id="menu"
          class="icon"
          aria-label="Main menu"
          aria-controls="drawer"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 18h18v-2H3v2Zm0-5h18v-2H3v2Zm0-7v2h18V6H3Z" />
          </svg>
        </button>
        <div class="brand">
          <svg class="lemon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M2,12a10,10 0 1 0 20,0a10,10 0 1 0 -20,0zM3.1,12a8.9,8.9 0 1 0 17.8,0a8.9,8.9 0 1 0 -17.8,0z"
            />
            <path
              d="M12.78,11.22L15.55,4.94A7.9,7.9 0 0 1 19.06,8.45ZM13.1,12L19.5,9.52A7.9,7.9 0 0 1 19.5,14.48ZM12.78,12.78L19.06,15.55A7.9,7.9 0 0 1 15.55,19.06ZM12,13.1L14.48,19.5A7.9,7.9 0 0 1 9.52,19.5ZM11.22,12.78L8.45,19.06A7.9,7.9 0 0 1 4.94,15.55ZM10.9,12L4.5,14.48A7.9,7.9 0 0 1 4.5,9.52ZM11.22,11.22L4.94,8.45A7.9,7.9 0 0 1 8.45,4.94ZM12,10.9L9.52,4.5A7.9,7.9 0 0 1 14.48,4.5Z"
            /></svg
          ><span>lmnaide</span>
        </div>
        <button type="button" id="today-pill" class="outlined">Today</button>
        <div class="pager">
          <button
            type="button"
            id="prev"
            class="icon"
            aria-label="Previous"
            title="Previous"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M15.41 16.59 10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41Z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="next"
            class="icon"
            aria-label="Next"
            title="Next"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41Z"
              />
            </svg>
          </button>
        </div>
        <button
          type="button"
          id="period"
          class="period"
          aria-expanded="false"
          aria-controls="mini"
        >
          <span id="period-title"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 10 5 5 5-5H7Z" />
          </svg>
        </button>
        <button
          type="button"
          id="search"
          class="icon"
          aria-label="Search"
          title="Search"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"
            />
          </svg>
        </button>
        <button
          type="button"
          id="today"
          class="icon"
          aria-label="Today"
          title="Today"
        >
          <span class="today-box" id="today-date"></span>
        </button>
        <button
          type="button"
          id="view-menu"
          class="outlined view-menu"
          aria-haspopup="menu"
        >
          <span id="view-label"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 10 5 5 5-5H7Z" />
          </svg>
        </button>
        <button
          type="button"
          id="avatar"
          class="avatar"
          aria-label="Account"
          aria-haspopup="dialog"
        ></button>
      </header>

      <div id="mini" class="mini" hidden></div>

      <nav id="drawer" class="drawer" aria-label="Main menu" inert>
        <!-- Wide screens show these in the sidebar, like Google Calendar on the web. -->
        <button type="button" id="create" class="create">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2Z" /></svg
          >Create
        </button>
        <div id="side-mini" class="side-mini"></div>
        <div class="wordmark">
          <svg class="lemon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M2,12a10,10 0 1 0 20,0a10,10 0 1 0 -20,0zM3.1,12a8.9,8.9 0 1 0 17.8,0a8.9,8.9 0 1 0 -17.8,0z"
            />
            <path
              d="M12.78,11.22L15.55,4.94A7.9,7.9 0 0 1 19.06,8.45ZM13.1,12L19.5,9.52A7.9,7.9 0 0 1 19.5,14.48ZM12.78,12.78L19.06,15.55A7.9,7.9 0 0 1 15.55,19.06ZM12,13.1L14.48,19.5A7.9,7.9 0 0 1 9.52,19.5ZM11.22,12.78L8.45,19.06A7.9,7.9 0 0 1 4.94,15.55ZM10.9,12L4.5,14.48A7.9,7.9 0 0 1 4.5,9.52ZM11.22,11.22L4.94,8.45A7.9,7.9 0 0 1 8.45,4.94ZM12,10.9L9.52,4.5A7.9,7.9 0 0 1 14.48,4.5Z"
            /></svg
          ><span>lmnaide</span>
        </div>
        <div id="views"></div>
        <hr />
        <p class="section">Calendars</p>
        <div id="visibility"></div>
        <button type="button" id="manage" class="nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M5 10h14v2h2V6c0-1.1-.9-2-2-2h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h7v-2H5V10Zm0-4h14v2H5V6Zm17.84 10.28-.71.71-2.12-2.12.71-.71a1 1 0 0 1 1.41 0l.71.71a1 1 0 0 1 0 1.41Zm-3.54-.7 2.12 2.12-5.3 5.3H14v-2.12l5.3-5.3Z"
            /></svg
          >Manage calendars
        </button>
        <hr />
        <button type="button" id="settings" class="nav-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1a.57.57 0 0 0-.18-.03c-.17 0-.34.09-.43.25l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46a.5.5 0 0 0 .61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.06.02.12.03.18.03.17 0 .34-.09.43-.25l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65Zm-1.98-1.71c.04.31.05.52.05.73 0 .21-.02.43-.05.73l-.14 1.13.89.7 1.08.84-.7 1.21-1.27-.51-1.04-.42-.9.68c-.43.32-.84.56-1.25.73l-1.06.43-.16 1.13-.2 1.35h-1.4l-.19-1.35-.16-1.13-1.06-.43c-.43-.18-.83-.41-1.23-.71l-.91-.7-1.06.43-1.27.51-.7-1.21 1.08-.84.89-.7-.14-1.13c-.03-.31-.05-.54-.05-.74s.02-.43.05-.73l.14-1.13-.89-.7-1.08-.84.7-1.21 1.27.51 1.04.42.9-.68c.43-.32.84-.56 1.25-.73l1.06-.43.16-1.13.2-1.35h1.39l.19 1.35.16 1.13 1.06.43c.43.18.83.41 1.23.71l.91.7 1.06-.43 1.27-.51.7 1.21-1.07.85-.89.7.14 1.13ZM12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4Zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2Z"
            /></svg
          >Settings
        </button>
      </nav>

      <main id="view" class="view"></main>

      <button type="button" id="add" class="fab" aria-label="New event">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect fill="#EA4335" x="9.96" y="0" width="4.08" height="14.04" />
          <rect fill="#4285F4" x="9.96" y="9.96" width="14.04" height="4.08" />
          <rect fill="#34A853" x="9.96" y="9.96" width="4.08" height="14.04" />
          <rect fill="#FBBC04" x="0" y="9.96" width="14.04" height="4.08" />
        </svg>
      </button>
    </section>

    <div id="scrim" class="scrim" hidden></div>

    <div id="snackbar" role="status"></div>

    <!-- Full-screen pages, like the app's own screens. -->
    <dialog id="detail" class="page"></dialog>
    <dialog id="editor" class="page"></dialog>
    <dialog id="calendars" class="page"></dialog>
    <dialog id="search-page" class="page"></dialog>
    <dialog id="settings-page" class="page"></dialog>
    <dialog id="history-page" class="page"></dialog>
    <!-- Material alert dialogs, stacked above pages. -->
    <dialog id="alert" class="alert"></dialog>
    <!-- Quick add, as a bottom sheet like the app's. -->
    <dialog id="quick" class="sheet"></dialog>
    <!-- The account card under the profile photo. -->
    <dialog id="account" class="account-card"></dialog>
    <input id="photo-input" type="file" accept="image/*" hidden />
  </body>
</html>
