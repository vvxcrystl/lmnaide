services:
  calendar:
    build: .
    ports: ["3000:3000"]
    volumes: ["calendar-data:/data"]
    environment:
      ALLOW_REGISTRATION: "true"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  calendar-data:
