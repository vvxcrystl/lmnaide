services:
  calendar:
    build: .
    volumes: ["calendar-data:/data"]
    environment:
      PUBLIC_URL: "https://${CALENDAR_DOMAIN:?Set CALENDAR_DOMAIN to your hostname}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-true}"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  https:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CALENDAR_DOMAIN: "${CALENDAR_DOMAIN:?Set CALENDAR_DOMAIN to your hostname}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      calendar:
        condition: service_healthy
volumes:
  calendar-data:
  caddy-data:
  caddy-config:
